<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catálogo — Vivero Leufucades{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#F9FAF8] text-[#1F2933] text-[15px] antialiased flex flex-col">
    <header class="bg-white border-b border-[#E2E8E4] sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-2.5 focus:outline-none focus:ring-2 focus:ring-[#2D6A4F] rounded-md px-1">
                <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[#1B4332] text-[#D8F3DC] font-semibold text-base">
                    VL
                </span>
                <div>
                    <span class="block text-lg font-semibold text-[#1B4332] leading-tight">Vivero Leufucades</span>
                    <span class="block text-xs text-[#52606D]">Región de Los Ríos, Chile</span>
                </div>
            </a>

            <form method="get" action="/" class="flex-1 max-w-md flex items-center gap-2">
                <label for="buscador-catalogo" class="sr-only">Buscar especie</label>
                <input
                    id="buscador-catalogo"
                    type="search"
                    name="q"
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="Buscar por nombre común o científico..."
                    class="w-full min-h-[44px] px-3.5 rounded-lg border border-[#E2E8E4] bg-[#F9FAF8] text-[#1F2933] placeholder-[#52606D] focus:outline-none focus:ring-2 focus:ring-[#2D6A4F] focus:bg-white"
                >
                <button
                    type="submit"
                    class="min-h-[44px] px-4 rounded-lg bg-[#1B4332] hover:bg-[#2D6A4F] text-white font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-[#2D6A4F] focus:ring-offset-1"
                >
                    Buscar
                </button>
            </form>

            <a
                href="{% url 'core:login' %}"
                class="min-h-[44px] inline-flex items-center px-4 rounded-lg border border-[#E2E8E4] bg-white hover:bg-[#F9FAF8] text-[#52606D] hover:text-[#1B4332] text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]"
            >
                Acceso Vivero
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-[#E2E8E4] py-4 text-center text-xs text-[#52606D]">
        Vivero Leufucades — Catálogo Comercial Público
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
